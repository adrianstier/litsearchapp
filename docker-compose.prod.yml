version: '3.8'

# Production Docker Compose configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: litsearch-backend-prod
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - litsearch-database:/app/database
      - litsearch-papers:/app/papers
      - litsearch-cache:/app/cache
      - litsearch-logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/database/papers.db
      - PAPERS_DIR=/app/papers
      - CACHE_DIR=/app/cache
      - OUTPUT_DIR=/app/output
      - LOG_LEVEL=WARNING
      - DEBUG=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - CROSSREF_MAILTO=${CROSSREF_MAILTO:-litsearch@example.com}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - litsearch-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=/api
    container_name: litsearch-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - litsearch-network

networks:
  litsearch-network:
    driver: bridge

volumes:
  litsearch-database:
    driver: local
  litsearch-papers:
    driver: local
  litsearch-cache:
    driver: local
  litsearch-logs:
    driver: local
